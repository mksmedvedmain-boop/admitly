# CI: бэкенд-тесты Admitly на каждый push/PR в main.
# Тесты двух видов:
#   - юнит (test_scoring, test_social, test_fixes) — сервер не нужен;
#   - интеграционные (test_auth, test_catalog, часть test_social) — нужен
#     поднятый uvicorn на 127.0.0.1:8000, поэтому сервер стартуем в фоне
#     и ждём /health перед прогоном.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admitly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check frontend/app.js && node --check frontend/unidata.js
      - run: python3 tools/make_unidata.py --check
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admitly/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Юнит-тесты без сервера
      - run: python3 test_scoring.py
      - run: python3 -m unittest test_social
      - run: python3 -m unittest test_fixes
      # Сервер для интеграционных тестов (SQLite-фолбэк, демо-премиум для catalog)
      - name: Start API server
        run: |
          ADMITLY_DEMO_PREMIUM=1 nohup uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - run: python3 test_auth.py
      - run: ADMITLY_DEMO_PREMIUM=1 python3 test_catalog.py
      - run: python3 test_social.py
