# CI: бэкенд-тесты Admitly на каждый push/PR в main.
# Тесты — самописный фреймворк check() + unittest, запускаются напрямую
# (python3 -m unittest их не находит: файлы не вида test_*.py в пакете).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admitly/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 test_scoring.py
      - run: python3 test_social.py
      - run: python3 test_auth.py
      - run: python3 test_catalog.py
      - run: python3 test_fixes.py
